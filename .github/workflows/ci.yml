name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: 0.151.0
  THEMES_DIR: /tmp/themes
  # GitHub Pages n'est disponible que pour un dépôt public sur un compte gratuit.
  PUBLISH: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          wget -q -O hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      # Le thème est résolu par son nom, quel que soit le nom du dépôt cloné.
      - name: Link theme
        run: mkdir -p "$THEMES_DIR" && ln -s "$GITHUB_WORKSPACE" "$THEMES_DIR/hugo-portfolio-theme"

      - name: Build (strict, root-relative URLs)
        run: hugo --source exampleSite --themesDir "$THEMES_DIR" --gc --minify --panicOnWarning -b / -d "$GITHUB_WORKSPACE/public-check"

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/public-check 'public-check/**/*.html'
          fail: true

      - name: Configure Pages
        id: pages
        if: env.PUBLISH == 'true'
        uses: actions/configure-pages@v5

      - name: Build demo site
        if: env.PUBLISH == 'true'
        run: hugo --source exampleSite --themesDir "$THEMES_DIR" --gc --minify -b "${{ steps.pages.outputs.base_url }}/" -d "$GITHUB_WORKSPACE/public"

      - uses: actions/upload-pages-artifact@v3
        if: env.PUBLISH == 'true'
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
