# Valeurs par défaut du thème, fusionnées avec la configuration du site.

[module.hugoVersion]
  min = "0.146.0"
  extended = false

[params]
  # Couleur d'accent : rose, violet, indigo, orange, cyan, blue, red, pink, slate, green.
  accent = "rose"
  # Thème initial : system, light ou dark.
  colorScheme = "system"
  dateFormat = ":date_long"
  # Panneau de personnalisation (couleur, sens, thème) pour les visiteurs.
  tools = true

  [params.home]
    # Ordre et présence des sections de l'accueil (layouts/_partials/home/<nom>.html).
    sections = ["hero", "about", "achievements", "services", "projects", "contact", "testimonials", "posts"]
    projects = 6
    posts = 2
    services = 4

  [params.projects]
    # Projets par page (pagination côté navigateur, combinée aux filtres). 0 : tout afficher.
    perPage = 6

  [params.blog]
    perPage = 6
    showReadingTime = true
    showToc = true
