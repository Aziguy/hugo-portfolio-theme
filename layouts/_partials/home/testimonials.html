{{- with site.Data.testimonials -}}
<section class="section testimonials" id="testimonials" aria-labelledby="testimonials-title">
  <div class="container">
    {{ partial "ui/section-header.html" (dict "title" (T "testimonials_heading") "id" "testimonials-title") }}
    <div class="testimonials__stage">
      <div class="testimonials__avatars" aria-hidden="true">
        {{- range first 3 . }}{{ with .avatar }}<img src="{{ partial "func/image-url.html" (dict "page" $ "src" .) }}" alt="" loading="lazy">{{ end }}{{ end }}
      </div>
      <p class="testimonials__word" aria-hidden="true">{{ T "testimonials_title" }}</p>
      <div class="carousel" data-carousel>
        <ul class="carousel__track" data-carousel-track tabindex="0" aria-label="{{ T "testimonials_title" }}">
          {{- range . }}
            <li class="carousel__slide">
              <figure class="testimonial">
                {{- with .avatar }}{{ partial "ui/image.html" (dict "page" $ "src" . "alt" "" "class" "testimonial__photo") }}{{ end }}
                <figcaption class="testimonial__body">
                  <span class="testimonial__name">{{ .name }}</span>
                  {{- with partial "func/l.html" .role }}<span class="testimonial__role">({{ . }})</span>{{ end }}
                  <blockquote class="testimonial__quote">
                    {{ partial "ui/icon.html" "quote" }}
                    {{ partial "func/l.html" .quote | markdownify }}
                  </blockquote>
                </figcaption>
              </figure>
            </li>
          {{- end }}
        </ul>
        <div class="carousel__controls">
          <button class="icon-button" type="button" data-carousel-prev aria-label="{{ T "previous" }}">{{ partial "ui/icon.html" "chevron-left" }}</button>
          <button class="icon-button" type="button" data-carousel-next aria-label="{{ T "next" }}">{{ partial "ui/icon.html" "chevron-right" }}</button>
        </div>
      </div>
    </div>
  </div>
</section>
{{- end -}}
