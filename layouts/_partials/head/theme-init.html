{{- /* Applique thème, couleur et sens d'écriture mémorisés avant le premier rendu. */ -}}
<script>
  (function () {
    var root = document.documentElement;
    root.classList.replace('no-js', 'js');
    var mode = {{ site.Params.colorScheme | default "system" }};
    var dark = mode === 'dark';
    try {
      var stored = localStorage.getItem('theme');
      if (stored) dark = stored === 'dark';
      else if (mode === 'system') dark = matchMedia('(prefers-color-scheme: dark)').matches;
      var accent = localStorage.getItem('accent');
      if (accent) root.dataset.accent = accent;
      var dir = localStorage.getItem('dir');
      if (dir) root.dir = dir;
    } catch (e) {}
    root.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
