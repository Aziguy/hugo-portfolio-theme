<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="generator" content="Hugo {{ hugo.Version }}">
{{- with site.Params.favicon }}
<link rel="icon" href="{{ partial "func/image-url.html" (dict "page" $ "src" .) }}">
{{- else }}
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
{{- end }}
<link rel="preload" href="{{ "fonts/montserrat-latin-wght-normal.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
