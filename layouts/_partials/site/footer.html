<footer class="site-footer">
  <div class="container site-footer__inner">
    <p class="site-footer__meta">
      &copy; {{ now.Year }} <strong>{{ site.Params.author.name }}</strong>, {{ T "rights" }}
      {{- with site.Home.OutputFormats.Get "rss" }} · <a href="{{ .RelPermalink }}">{{ T "rss" }}</a>{{ end }}
    </p>
    {{ partial "ui/social-links.html" . }}
  </div>
</footer>
<a class="back-to-top" href="#top" aria-label="{{ T "back_to_top" }}" data-back-to-top>
  <svg class="back-to-top__ring" viewBox="0 0 52 52" aria-hidden="true" focusable="false"><circle cx="26" cy="26" r="24"/></svg>
  {{ partial "ui/icon.html" "arrow-up" }}
</a>
{{- if ne site.Params.tools false }}{{ partial "site/tools.html" . }}{{ end }}
